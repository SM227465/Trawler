# Seed configuration, copied into /config on FIRST START only (see the
# `qbittorrent-init` service in docker-compose.yml). qBittorrent owns the file
# afterwards and rewrites it on shutdown, so edits made here later are ignored.
#
# To change something on a running box: stop the container first, edit
# /data/qbittorrent/qBittorrent/qBittorrent.conf, then start it. Editing while
# it runs is silently overwritten when it exits.

[BitTorrent]
Session\DefaultSavePath=/downloads
Session\GlobalMaxRatio=-1
Session\GlobalUPSpeedLimit=0
Session\Port=6881
Session\QueueingSystemEnabled=false
Session\TempPathEnabled=false

[Meta]
MigrationVersion=8

[Network]
Cookies=@Invalid()
Proxy\HostnameLookupEnabled=false
Proxy\Profiles\BitTorrent=true
Proxy\Profiles\Misc=true
Proxy\Profiles\RSS=true

[Preferences]
Downloads\SavePath=/downloads
Downloads\TempPathEnabled=false

# ── WebUI ────────────────────────────────────────────────────────────────────
# Port 8080 is NEVER published to the host. It is reachable only from the
# compose network, by the api container.
#
# AuthSubnetWhitelist is what lets the api talk to qBittorrent with no
# credentials, so there is no third password to store or leak. Docker bridge
# networks live in 172.16.0.0/12; the other two ranges cover custom networks.
# Without it, every api call gets 403 and the app reports "qBittorrent is
# unavailable" — which looks like an app bug and is not one.
#
# CSRFProtection and HostHeaderValidation off, and LocalHostAuth off, because
# qBittorrent otherwise rejects cross-container requests. Safe ONLY because the
# WebUI port is unpublished. Never carry these to an exposed instance.
WebUI\Address=*
WebUI\ServerDomains=*
WebUI\AuthSubnetWhitelist=172.16.0.0/12, 10.0.0.0/8, 192.168.0.0/16
WebUI\AuthSubnetWhitelistEnabled=true
WebUI\CSRFProtection=false
WebUI\HostHeaderValidation=false
WebUI\LocalHostAuth=false
WebUI\Port=8080
