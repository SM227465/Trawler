name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race onto the same box. In-progress runs finish rather
# than being cancelled: killing a deploy midway can leave the server holding a
# half-pulled image set.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        app: [api, web]

    steps:
      - uses: actions/checkout@v4

      # Oracle's free tier is ARM (Ampere A1); most other providers are x86.
      # Building only the runner's own architecture produces an image that
      # simply will not start on the target, and the failure surfaces at
      # `docker pull` on the server rather than here.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}-${{ matrix.app }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: ./apps/${{ matrix.app }}
          target: runner
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    # Set a `production` environment in repo settings to require approval here.
    environment: production

    steps:
      # SLOW HALF, and deliberately its own step: nothing is stopped here, so a
      # timeout leaves the running stack exactly as it was. This used to share a
      # step with `up -d` under ssh-action's DEFAULT 10 MINUTE command_timeout,
      # and on a 954 MB box already pushing a 33 GB upload the pull ate the
      # budget. The kill landed between "api Recreated" and "web Recreate",
      # leaving four containers created, none started, and the site 502 until
      # someone started them by hand.
      - name: Fetch the new images
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Pulling two multi-arch images onto a small, busy box is minutes, not
          # seconds. The default would rather kill it than wait.
          command_timeout: 30m
          # No `script_stop`: ssh-action v1 dropped it and warns on unknown
          # inputs. The script's own `set -euo pipefail` is what aborts on error.
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}

            # Config and compose files come from git; secrets stay in the .env
            # that lives on the server and is never committed.
            git fetch --all
            git reset --hard origin/main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} --password-stdin

            export IMAGE_TAG=sha-${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull

      # FAST HALF: every byte is already on the box, so this is the container
      # swap and nothing else — the window where the site is down is as short as
      # this server can make it.
      - name: Start the new containers
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            export IMAGE_TAG=sha-${{ github.sha }}

            # `up -d` runs the one-shot `migrate` service first and gates api and
            # worker on it completing successfully, so a failed migration aborts
            # the deploy instead of starting code against a schema it does not
            # match. No separate migration step is needed or wanted here.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans

            # Caddy reads its config once, at startup, and the Caddyfile is a bind
            # mount — so `up -d` does NOT restart it when the file changes, because
            # the container definition is identical. Every Caddyfile edit silently
            # did nothing until someone restarted it by hand. `caddy reload` is not
            # an option either: the config sets `admin off`, deliberately.
            docker compose -f docker-compose.yml -f docker-compose.prod.yml restart caddy

            docker image prune -f --filter "until=168h"

      - name: Verify the deploy is actually serving
        run: |
          set -e
          # Give the stack a moment, then require a real 200 from the public
          # health endpoint. A deploy that starts containers but serves errors
          # is a failed deploy, and CI should say so.
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' \
              "https://${{ secrets.DEPLOY_DOMAIN }}/healthz" 2>/dev/null || echo 000)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::health check never returned 200 — check the server"
          exit 1

      # A deploy that dies mid-swap leaves containers created but not started,
      # and the box stays down until a human runs exactly this. `up -d` is
      # idempotent and the images are already local, so it is seconds — and a
      # no-op if the failure was something else entirely.
      - name: Bring the stack back up if the deploy died half way
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            export IMAGE_TAG=sha-${{ github.sha }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
